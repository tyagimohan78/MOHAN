# Local / single-server deployment: app + PostgreSQL.
# Secrets come from .env (see .env.example). Put a TLS-terminating reverse proxy (Caddy/nginx) in front.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ntso
      POSTGRES_USER: ${POSTGRES_USER:-ntso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ntso} -d ntso"]
      interval: 10s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ntso}:${POSTGRES_PASSWORD}@db:5432/ntso?schema=public
      UPLOAD_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
